name: Release

# Pushing a `v*` tag (e.g. `v0.2.0`) builds mct-cli and mct-mcp-server for 5
# OS/arch combos, smoke-tests the natively built ones, packages them and
# attaches the archives to a GitHub Release at that tag. The tag must equal
# `v` + the workspace version in Cargo.toml, or the build fails before
# anything is published.
#
# A manual run (Actions → Release → Run workflow, on any branch) is a dry
# run: the same build, smoke test and packaging, with the archives kept only
# as workflow artifacts. It never creates a tag or a release — the `release`
# job only runs for a tag push.
#
# This workflow does NOT publish to crates.io: see RELEASING.md for why that
# is a separate, currently blocked, manual step.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

env:
  RUST_TOOLCHAIN: "1.96.0"

permissions:
  contents: read

jobs:
  build:
    name: build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            native: true
          # Cross-compiled from an ubuntu-latest (x86_64) runner via a
          # system cross-linker — no `cross`/Docker needed since git2
          # (default-features = false) and rusqlite's bundled sqlite are
          # both plain C compiled through the `cc` crate, which a
          # cross-gcc handles the same as a native one. Not executable on
          # the runner, so it is built and packaged but not smoke-tested.
          - name: linux-arm64
            os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            native: false
          # `macos-13` was retired in December 2025. `macos-26-intel` is a
          # standard GitHub-hosted Intel (x64) image; `macos-latest` is arm64
          # and must not be used for this target.
          - name: macos-x86_64
            os: macos-26-intel
            target: x86_64-apple-darwin
            native: true
          - name: macos-arm64
            os: macos-latest
            target: aarch64-apple-darwin
            native: true
          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            native: true
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Resolve archive label (and check the tag matches the version)
        id: label
        shell: bash
        run: |
          set -euo pipefail
          version="$(cargo pkgid -p mct-cli | sed -E 's/.*[#@]//')"
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            if [ "$GITHUB_REF_NAME" != "v$version" ]; then
              echo "::error::tag $GITHUB_REF_NAME does not match the workspace version $version"
              exit 1
            fi
            echo "label=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          else
            echo "label=v$version-dryrun-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - name: Install aarch64 cross-linker (linux-arm64 only)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Build mct-cli and mct-mcp-server
        shell: bash
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc
        run: cargo build --release --locked --target ${{ matrix.target }} -p mct-cli -p mct-mcp-server

      - name: Smoke-test the binaries (native targets only)
        if: matrix.native
        shell: bash
        run: |
          set -euo pipefail
          bin="target/${{ matrix.target }}/release"
          "$bin/mct-cli" --version
          "$bin/mct-mcp-server" --help > /dev/null

      - name: Package archive (unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          pkg="mini-consumes-tokens-${{ steps.label.outputs.label }}-${{ matrix.name }}"
          dist="dist/$pkg"
          mkdir -p "$dist"
          cp "target/${{ matrix.target }}/release/mct-cli" "$dist/"
          cp "target/${{ matrix.target }}/release/mct-mcp-server" "$dist/"
          cp README.md LICENSE THIRD_PARTY_NOTICES.md CHANGELOG.md "$dist/"
          tar -C dist -czf "dist/$pkg.tar.gz" "$pkg"
          rm -rf "$dist"
          # install.sh expects exactly this layout: one top-level
          # mini-consumes-tokens-* directory holding both binaries.
          listing="$(tar -tzf "dist/$pkg.tar.gz")"
          for f in mct-cli mct-mcp-server README.md LICENSE THIRD_PARTY_NOTICES.md CHANGELOG.md; do
            printf '%s\n' "$listing" | grep -qx "$pkg/$f" || { echo "::error::$f missing from $pkg.tar.gz"; exit 1; }
          done

      - name: Package archive (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $pkg = "mini-consumes-tokens-${{ steps.label.outputs.label }}-${{ matrix.name }}"
          $dist = "dist/$pkg"
          New-Item -ItemType Directory -Force -Path $dist | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/mct-cli.exe" "$dist/"
          Copy-Item "target/${{ matrix.target }}/release/mct-mcp-server.exe" "$dist/"
          Copy-Item README.md,LICENSE,THIRD_PARTY_NOTICES.md,CHANGELOG.md "$dist/"
          # The directory itself (not "$dist/*"), so the zip keeps the
          # top-level mini-consumes-tokens-* folder install.ps1 looks for.
          Compress-Archive -Path $dist -DestinationPath "dist/$pkg.zip"
          Remove-Item -Recurse -Force $dist
          $check = "dist-check"
          Expand-Archive -Path "dist/$pkg.zip" -DestinationPath $check
          foreach ($f in "mct-cli.exe","mct-mcp-server.exe","README.md","LICENSE","THIRD_PARTY_NOTICES.md","CHANGELOG.md") {
            if (-not (Test-Path (Join-Path $check "$pkg/$f"))) { throw "$f missing from $pkg.zip" }
          }
          Remove-Item -Recurse -Force $check

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  release:
    name: create GitHub release
    needs: build
    # Never on a manual (dry) run: only a pushed `v*` tag publishes.
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten artifacts into one release/ dir
        run: |
          set -euo pipefail
          mkdir -p release
          find artifacts -type f \( -name '*.tar.gz' -o -name '*.zip' \) -exec cp {} release/ \;
          ls -la release
          count="$(find release -type f | wc -l)"
          [ "$count" -eq 5 ] || { echo "::error::expected 5 archives, found $count"; exit 1; }

      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          fail_on_unmatched_files: true
          body: |
            See [CHANGELOG.md at ${{ github.ref_name }}](https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/CHANGELOG.md) for the changes and the upgrade steps.

            Prebuilt binaries below (mct-cli + mct-mcp-server) for Linux (x86_64/arm64), macOS (Intel/Apple Silicon), and Windows (x86_64). They are built without the optional `semantic` feature: `hybrid_search` returns its lexical ranking and says so; build `mct-mcp-server` from source with `--features semantic` for embedding search.

            The crates are not published to crates.io (see [RELEASING.md at ${{ github.ref_name }}](https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/RELEASING.md)).
