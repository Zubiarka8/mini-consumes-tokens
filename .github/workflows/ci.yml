name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  # Full validation on demand (works once this file is on the default branch).
  workflow_dispatch:
  # ci-recovery.yml calls this workflow to validate a repair branch in full.
  workflow_call:

permissions:
  contents: read

# A new push to a pull request supersedes its earlier run: cancel that one
# so the queue holds one run per pull request, not one per push. The free
# runner pool (20 jobs, 5 on macOS) otherwise falls hours behind. A push to
# `main` is never cancelled: every merge keeps its own record.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Pinned to an exact stable release, never `stable` floating — a CI run
  # from six months ago and one from today must build with the same
  # compiler. Bump deliberately, in its own commit, when there's a reason to.
  RUST_TOOLCHAIN: "1.96.0"

jobs:
  # Level 0, observation mode: computes which crates and platforms a change
  # needs (scripts/ci, see docs/03-ci/incremental-ci.md) and writes the plan
  # to the run summary. Nothing consumes it yet: build-test still runs the
  # full suite until the plan has been compared with full runs.
  plan:
    name: CI plan (observation)
    runs-on: ubuntu-latest
    outputs:
      level: ${{ steps.plan.outputs.level }}
      full: ${{ steps.plan.outputs.full }}
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
      - name: Plan
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
        run: |
          python3 scripts/ci/main.py plan --event "$EVENT" --base "$BASE" --head "$HEAD_SHA"
          python3 scripts/ci/main.py run --dry-run --event "$EVENT" --base "$BASE" --head "$HEAD_SHA"

  # The CI's own scripts and workflows. Standard library Python and a
  # checksum-pinned actionlint only: no project build, so a broken Rust
  # workspace cannot stop the CI from checking itself.
  ci-scripts:
    name: CI scripts and workflows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: CI planner tests
        working-directory: scripts/ci/tests
        run: python3 -m unittest discover -t . -s . -v
      - name: actionlint
        env:
          VERSION: "1.7.12"
          SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
        run: |
          file="actionlint_${VERSION}_linux_amd64.tar.gz"
          curl -sSfL --retry 3 -o "$RUNNER_TEMP/$file" "https://github.com/rhysd/actionlint/releases/download/v${VERSION}/${file}"
          echo "${SHA256}  $RUNNER_TEMP/$file" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$file" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color

  # rustfmt's output doesn't depend on the OS, so one Linux run is enough.
  # Same pinned toolchain as the build, so a newer rustfmt can't make CI
  # disagree with a contributor's `cargo fmt`.
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master 2026-10-16
        with:
          toolchain: 1.96.0
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all --check

  # The dashboard embeds two bundles built from crates/mct-cli/web-ui and
  # committed (review-dist/, notes-dist/, graph-dist/), so the Rust build needs no Node.
  # A bundle that is not rebuilt after a source change would ship stale code:
  # rebuild both from the lockfile and fail if the committed files differ.
  web-bundles:
    name: web bundles are fresh + web tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            crates/mct-cli/web-ui/package-lock.json
            crates/mct-cli/tests/dashboard/package-lock.json

      - name: Install web-ui dependencies
        working-directory: crates/mct-cli/web-ui
        run: npm ci

      - name: web-ui tests (review workspace and notes renderer)
        working-directory: crates/mct-cli/web-ui
        run: npm test

      - name: Rebuild the bundles
        working-directory: crates/mct-cli/web-ui
        run: npm run build

      - name: Committed bundles match their source
        run: |
          if ! git diff --exit-code -- crates/mct-cli/src/web/review-dist crates/mct-cli/src/web/notes-dist crates/mct-cli/src/web/graph-dist; then
            echo "::error::Committed bundles are stale. Run 'npm run build' in crates/mct-cli/web-ui and commit review-dist/, notes-dist/ and graph-dist/."
            exit 1
          fi
          if [ -n "$(git status --porcelain -- crates/mct-cli/src/web/notes-dist crates/mct-cli/src/web/graph-dist)" ]; then
            echo "::error::notes-dist/ or graph-dist/ has files that are not committed."
            exit 1
          fi

      - name: Install dashboard test dependencies
        working-directory: crates/mct-cli/tests/dashboard
        run: npm ci

      - name: Dashboard tests (the page against the committed bundles)
        working-directory: crates/mct-cli/tests/dashboard
        run: npm test

  build-test:
    name: build + test + clippy (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master 2026-10-16
        with:
          toolchain: 1.96.0
          components: clippy

      # PRs restore the cache main saved but never write their own: the
      # repository was over its 10 GB cache quota (10.67 GB, 110 entries on
      # 2026-11-17), so every save evicted another entry.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # Windows note (see CONTRIBUTING.md "Windows build prerequisites"):
      # git2 (default-features = false, so no openssl/libssh2 system deps)
      # and every tree-sitter grammar are plain C compiled via the `cc`
      # crate — on windows-latest that resolves to the MSVC toolset the
      # runner ships preinstalled. No extra system dependency to install
      # here; this step exists only to fail loudly and early if that ever
      # stops being true, instead of failing obscurely at the test step.
      - name: "Build workspace (all targets: lib, bins, examples, tests)"
        run: cargo build --locked --workspace --all-targets

      # Runs the tree-sitter parsing + SQLite query integration tests for
      # all 8 language crates (Rust, Python, Lua, Java, C#, JS/TS, C++, Go)
      # on every OS — first time this project confirms Windows behaves the
      # same as Linux/macOS here, not just "probably fine because it built".
      - name: Test workspace
        run: cargo test --locked --workspace

      - name: Test Unix installer destination (local release fixture)
        if: runner.os != 'Windows'
        run: python3 scripts/unix/tests/test_install.py

      # Nothing else runs scripts/windows/: parse every script with
      # PowerShell's own parser, then run the two scripts whose cargo
      # invocations a language or library change touches.
      - name: PowerShell scripts (parse all, run new-language-check and corpus-report)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $errors = Get-ChildItem scripts/windows -Recurse -Filter *.ps1 | ForEach-Object {
            $parseErrors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$parseErrors)
            $parseErrors | ForEach-Object { "$($_.Extent.File):$($_.Extent.StartLineNumber): $($_.Message)" }
          }
          if ($errors) { $errors; exit 1 }
          scripts/windows/new-language-check.ps1 lua --no-tests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          scripts/windows/corpus-report.ps1 css
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # Deny-by-default clippy PLUS clippy::unwrap_used/expect_used/panic
      # across the whole workspace — including tests/examples, since
      # --all-targets covers them. This means every `src/` call site that
      # legitimately can't fail (grammar setup on a statically linked
      # tree-sitter grammar, globs built from hardcoded literals) carries its
      # own `#[allow(clippy::expect_used)]` plus a `// SAFETY:` comment
      # justifying it right there — never a module- or crate-wide allow. Every
      # `tests/`/`examples/` file carries a file-level
      # `#![allow(clippy::unwrap_used, clippy::expect_used, clippy::panic)]`
      # instead, since panicking on a broken test precondition is correct
      # there. A NEW unwrap()/expect()/panic!() added to `src/` without its
      # own justified `#[allow]` fails this step — that is the point.
      - name: Clippy (deny warnings, unwrap/expect/panic in production code)
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings -D clippy::unwrap_used -D clippy::expect_used -D clippy::panic

  cargo-audit:
    name: cargo-audit (dependency vulnerabilities)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master 2026-10-16
        with:
          toolchain: 1.96.0
      - uses: taiki-e/install-action@b80e2bb2635f28eb98b9fce1e2f0887e1535c6b2 # v2.90.0
        with:
          tool: cargo-audit

      # Pass 1: full report, every severity, informational only. Low/medium
      # findings must stay visible in CI output even though they don't fail
      # the job — this step's exit code is deliberately ignored.
      - name: Full vulnerability report (all severities, non-blocking)
        run: cargo audit || true

      # Pass 2: the actual gate. `severity_threshold` in [advisories]
      # EXCLUDES vulnerabilities below the threshold from consideration
      # entirely (verified against cargo-audit's own source/config docs,
      # not guessed) — so after filtering to "high", cargo-audit's default
      # behavior (fail if any vulnerability remains) is exactly the
      # high/critical-only gate this job wants. Advisories with no explicit
      # CVSS score (informational-only) are NOT filtered by this and will
      # still fail this step — a deliberate fail-safe for unscored issues,
      # not an oversight.
      - name: Fail only on high/critical severity
        run: |
          mkdir -p .cargo
          cat > .cargo/audit.toml <<'EOF'
          [advisories]
          severity_threshold = "high"
          EOF
          cargo audit

  # The one stable check to require on main: it runs even when a job before
  # it failed, and passes only if every job listed in
  # scripts/ci/ci_policy.toml [gate].required ended in `success`. A required
  # job that was skipped, cancelled or never ran blocks it. `always()` (not
  # `!cancelled()`) on purpose: GitHub reports a skipped required check as
  # passing, so a cancelled run must end this job red, not skipped.
  ci-gate:
    name: CI gate
    if: always()
    needs: [plan, ci-scripts, fmt, web-bundles, build-test, cargo-audit]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Every required job succeeded
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: python3 scripts/ci/main.py gate
