[workspace]
resolver = "2"
members = [
    "crates/ccm-core",
    "crates/ccm-index",
    "crates/ccm-lang-rust",
    "crates/ccm-lang-python",
    "crates/ccm-mcp-server",
    "crates/ccm-cli",
    "crates/ccm-lang-lua",
    "crates/ccm-lang-java",
    "crates/ccm-lang-csharp",
    "crates/ccm-lang-js-ts",
    "crates/ccm-lang-cpp",
    "crates/ccm-lang-go",
    "crates/ccm-lang-html",
    "crates/ccm-lang-css",
    "crates/ccm-lang-xml",
    "crates/ccm-lang-xaml",
    "crates/ccm-lang-bash",
    "crates/ccm-lang-powershell",
    "crates/ccm-lang-php",
    "crates/ccm-lang-md",
    "crates/ccm-lang-kotlin",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/zubiarka8/mini-consumes-tokens"

[workspace.dependencies]
# `version` alongside `path` is required for `cargo publish`: crates.io
# resolves published dependents by version, path is only used for local
# workspace builds and is stripped from the packaged Cargo.toml.
ccm-core = { path = "crates/ccm-core", version = "0.1.0" }
ccm-index = { path = "crates/ccm-index", version = "0.1.0" }
ccm-lang-rust = { path = "crates/ccm-lang-rust", version = "0.1.0" }
ccm-lang-python = { path = "crates/ccm-lang-python", version = "0.1.0" }
ccm-lang-java = { path = "crates/ccm-lang-java", version = "0.1.0" }
ccm-lang-csharp = { path = "crates/ccm-lang-csharp", version = "0.1.0" }
ccm-lang-js-ts = { path = "crates/ccm-lang-js-ts", version = "0.1.0" }
ccm-lang-cpp = { path = "crates/ccm-lang-cpp", version = "0.1.0" }
ccm-lang-go = { path = "crates/ccm-lang-go", version = "0.1.0" }
ccm-lang-html = { path = "crates/ccm-lang-html", version = "0.1.0" }
ccm-lang-css = { path = "crates/ccm-lang-css", version = "0.1.0" }
ccm-lang-xml = { path = "crates/ccm-lang-xml", version = "0.1.0" }
ccm-lang-xaml = { path = "crates/ccm-lang-xaml", version = "0.1.0" }
ccm-lang-bash = { path = "crates/ccm-lang-bash", version = "0.1.0" }
ccm-lang-powershell = { path = "crates/ccm-lang-powershell", version = "0.1.0" }
ccm-lang-php = { path = "crates/ccm-lang-php", version = "0.1.0" }
ccm-lang-md = { path = "crates/ccm-lang-md", version = "0.1.0" }
ccm-lang-kotlin = { path = "crates/ccm-lang-kotlin", version = "0.1.0" }
thiserror = "2"
tree-sitter = "0.25"
