[workspace]
resolver = "2"
members = [
    "crates/mct-core",
    "crates/mct-index",
    "crates/mct-lang-rust",
    "crates/mct-lang-python",
    "crates/mct-mcp-server",
    "crates/mct-cli",
    "crates/mct-languages",
    "crates/mct-lang-lua",
    "crates/mct-lang-java",
    "crates/mct-lang-csharp",
    "crates/mct-lang-js-ts",
    "crates/mct-lang-cpp",
    "crates/mct-lang-go",
    "crates/mct-lang-html",
    "crates/mct-lang-css",
    "crates/mct-lang-xml",
    "crates/mct-lang-xaml",
    "crates/mct-lang-bash",
    "crates/mct-lang-powershell",
    "crates/mct-lang-php",
    "crates/mct-lang-md",
    "crates/mct-lang-kotlin",
    "crates/mct-eval",
    "crates/mct-corpus",
    "crates/mct-tree-sitter",
]
# A patched dependency, not a member: see [patch.crates-io] below.
exclude = ["vendor/tree-sitter-md"]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/zubiarka8/mini-consumes-tokens"

[workspace.dependencies]
# `version` alongside `path` is required for `cargo publish`: crates.io
# resolves published dependents by version, path is only used for local
# workspace builds and is stripped from the packaged Cargo.toml.
mct-core = { path = "crates/mct-core", version = "0.2.0" }
mct-index = { path = "crates/mct-index", version = "0.2.0" }
mct-languages = { path = "crates/mct-languages", version = "0.2.0" }
mct-lang-rust = { path = "crates/mct-lang-rust", version = "0.2.0" }
mct-lang-python = { path = "crates/mct-lang-python", version = "0.2.0" }
mct-lang-java = { path = "crates/mct-lang-java", version = "0.2.0" }
mct-lang-csharp = { path = "crates/mct-lang-csharp", version = "0.2.0" }
mct-lang-js-ts = { path = "crates/mct-lang-js-ts", version = "0.2.0" }
mct-lang-cpp = { path = "crates/mct-lang-cpp", version = "0.2.0" }
mct-lang-go = { path = "crates/mct-lang-go", version = "0.2.0" }
mct-lang-html = { path = "crates/mct-lang-html", version = "0.2.0" }
mct-lang-css = { path = "crates/mct-lang-css", version = "0.2.0" }
mct-lang-xml = { path = "crates/mct-lang-xml", version = "0.2.0" }
mct-lang-xaml = { path = "crates/mct-lang-xaml", version = "0.2.0" }
mct-lang-bash = { path = "crates/mct-lang-bash", version = "0.2.0" }
mct-lang-powershell = { path = "crates/mct-lang-powershell", version = "0.2.0" }
mct-lang-php = { path = "crates/mct-lang-php", version = "0.2.0" }
mct-lang-md = { path = "crates/mct-lang-md", version = "0.2.0" }
mct-lang-kotlin = { path = "crates/mct-lang-kotlin", version = "0.2.0" }
mct-lang-lua = { path = "crates/mct-lang-lua", version = "0.2.0" }
# Test-only (publish = false): path-only, so `cargo publish` strips it from
# the dev-dependencies of every crate that uses it.
mct-corpus = { path = "crates/mct-corpus" }
mct-tree-sitter = { path = "crates/mct-tree-sitter", version = "0.2.0" }
thiserror = "2"
tree-sitter = "0.25"

# tree-sitter-md 0.5.3, the latest release, has two memory-safety bugs in its
# block scanner reachable from ordinary Markdown: an unbounded `serialize`
# that overflows tree-sitter's 1024-byte buffer on deep nesting (upstream
# issue #243) and `isdigit` called with full code points (upstream #252).
# Neither is fixed upstream. `vendor/tree-sitter-md` is the unmodified crate
# plus those two fixes (see its git history). `cargo publish` ignores this
# patch: drop it once an upstream release carries both fixes, and do not
# publish mct-lang-md before then. Every fuzz workspace that builds
# mct-lang-md repeats this patch.
[patch.crates-io]
tree-sitter-md = { path = "vendor/tree-sitter-md" }
