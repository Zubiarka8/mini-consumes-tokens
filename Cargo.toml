[workspace]
resolver = "2"
members = [
    "crates/mct-core",
    "crates/mct-index",
    "crates/mct-lang-rust",
    "crates/mct-lang-python",
    "crates/mct-mcp-server",
    "crates/mct-cli",
    "crates/mct-lang-lua",
    "crates/mct-lang-java",
    "crates/mct-lang-csharp",
    "crates/mct-lang-js-ts",
    "crates/mct-lang-cpp",
    "crates/mct-lang-go",
    "crates/mct-lang-html",
    "crates/mct-lang-css",
    "crates/mct-lang-xml",
    "crates/mct-lang-xaml",
    "crates/mct-lang-bash",
    "crates/mct-lang-powershell",
    "crates/mct-lang-php",
    "crates/mct-lang-md",
    "crates/mct-lang-kotlin",
    "crates/mct-eval",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/zubiarka8/mini-consumes-tokens"

[workspace.dependencies]
# `version` alongside `path` is required for `cargo publish`: crates.io
# resolves published dependents by version, path is only used for local
# workspace builds and is stripped from the packaged Cargo.toml.
mct-core = { path = "crates/mct-core", version = "0.1.0" }
mct-index = { path = "crates/mct-index", version = "0.1.0" }
mct-lang-rust = { path = "crates/mct-lang-rust", version = "0.1.0" }
mct-lang-python = { path = "crates/mct-lang-python", version = "0.1.0" }
mct-lang-java = { path = "crates/mct-lang-java", version = "0.1.0" }
mct-lang-csharp = { path = "crates/mct-lang-csharp", version = "0.1.0" }
mct-lang-js-ts = { path = "crates/mct-lang-js-ts", version = "0.1.0" }
mct-lang-cpp = { path = "crates/mct-lang-cpp", version = "0.1.0" }
mct-lang-go = { path = "crates/mct-lang-go", version = "0.1.0" }
mct-lang-html = { path = "crates/mct-lang-html", version = "0.1.0" }
mct-lang-css = { path = "crates/mct-lang-css", version = "0.1.0" }
mct-lang-xml = { path = "crates/mct-lang-xml", version = "0.1.0" }
mct-lang-xaml = { path = "crates/mct-lang-xaml", version = "0.1.0" }
mct-lang-bash = { path = "crates/mct-lang-bash", version = "0.1.0" }
mct-lang-powershell = { path = "crates/mct-lang-powershell", version = "0.1.0" }
mct-lang-php = { path = "crates/mct-lang-php", version = "0.1.0" }
mct-lang-md = { path = "crates/mct-lang-md", version = "0.1.0" }
mct-lang-kotlin = { path = "crates/mct-lang-kotlin", version = "0.1.0" }
thiserror = "2"
tree-sitter = "0.25"
