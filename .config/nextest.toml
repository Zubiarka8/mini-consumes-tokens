# cargo-nextest configuration. CI runs `cargo nextest run --profile ci`.
# Local `cargo test` is unaffected.

[profile.ci]
# Report every failing test of a run, not only the first one.
fail-fast = false
# A slow test is reported after 60s; one stuck for 5 minutes is killed
# instead of holding a runner until the job timeout.
slow-timeout = { period = "60s", terminate-after = 5 }
failure-output = "immediate-final"
