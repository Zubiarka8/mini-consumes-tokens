[package]
name = "mct-lang-php"
description = "PHP language plugin (tree-sitter-php) for mini-consumes-tokens's LanguageParser trait."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["mcp", "tree-sitter", "php", "code-index"]
categories = ["development-tools", "parser-implementations"]

[dependencies]
mct-core.workspace = true
mct-tree-sitter.workspace = true
tree-sitter.workspace = true
# PHP 8.5 final property promotion, pending an upstream release.
tree-sitter-php = { version = "0.25.2", path = "../../vendor/tree-sitter-php" }

[dev-dependencies]
mct-corpus.workspace = true
mct-index.workspace = true
