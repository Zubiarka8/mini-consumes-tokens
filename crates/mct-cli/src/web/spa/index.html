<!doctype html>
<html lang="es" class="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<meta name="csrf-token" content="__CSRF__">
<title>MCT Dashboard</title>
<link rel="stylesheet" href="spa.css">
<script src="spa.js" defer></script>
<script src="alpine.js" defer></script>
</head>
<body class="font-sans text-[13px] antialiased" x-data="dashboard" x-cloak>
<svg class="hidden" aria-hidden="true" focusable="false">__SPRITE__</svg>

<div class="flex min-h-screen flex-col lg:h-screen lg:overflow-hidden">

  <header class="flex flex-wrap items-center gap-x-4 gap-y-2 border-b border-line bg-panel px-4 py-2 xl:flex-nowrap">
    <div class="flex min-w-0 items-center gap-3">
      <span class="grid h-8 w-8 shrink-0 place-items-center rounded-lg bg-brand text-onbrand"><svg class="icon h-[18px] w-[18px]"><use href="#i-box"></use></svg></span>
      <span class="truncate text-[15px] font-semibold" x-text="brandName"></span>
      <span class="hidden h-5 w-px bg-line sm:block"></span>
      <span class="hidden truncate font-mono text-[12px] text-mute sm:block" x-text="crumb"></span>
    </div>
    <nav class="flex shrink-0 gap-1" :aria-label="L.sections" x-show="listMode">
      <template x-for="n in nav" :key="n.view">
        <button type="button" :data-v="n.view" @click="go" class="flex items-center gap-2 rounded-lg px-3 py-2 transition hover:text-ink" :class="n.cls">
          <svg class="icon"><use :href="n.icon"></use></svg><span x-text="n.label"></span>
          <span class="rounded-full bg-panel2 px-1.5 text-[10px]" x-show="n.count" x-text="n.count"></span>
        </button>
      </template>
    </nav>
    <div class="order-last flex w-full flex-wrap items-center gap-2 md:order-none md:mx-auto md:w-auto md:min-w-[14rem] md:flex-1" x-show="showSearch">
    <label class="relative min-w-0 flex-1 md:max-w-xl">
      <svg class="icon pointer-events-none absolute left-3 top-1/2 -translate-y-1/2 text-mute"><use href="#i-search"></use></svg>
      <input type="search" :value="searchValue" @input="headerSearch" :placeholder="L.searchAll" :aria-label="L.searchAll" class="w-full rounded-lg border border-line bg-panel2 py-2 pl-9 pr-3 outline-none transition focus:border-brand focus:bg-panel">
    </label>
    <div class="flex shrink-0 items-center gap-2" x-show="showDupEditor" role="group" :aria-label="L.editorOptions">
      <button type="button" @click="openAll" class="whitespace-nowrap rounded-md border border-line px-2.5 py-2 transition hover:bg-panel2" x-text="L.openAll"></button>
      <button type="button" @click="closeAll" class="whitespace-nowrap rounded-md border border-line px-2.5 py-2 transition hover:bg-panel2" x-text="L.closeAll"></button>
    </div>
    </div>
    <div class="ml-auto flex shrink-0 items-center gap-1 text-mute">
      <span class="mr-2 flex items-center gap-1 text-warn" x-show="busy" role="status"><svg class="icon"><use href="#i-refresh-cw"></use></svg><span x-text="L.updating"></span></span>
      <span class="mr-2 flex items-center gap-1 text-bad" x-show="offline" role="alert"><svg class="icon"><use href="#i-triangle-alert"></use></svg><span x-text="L.offline"></span></span>
      <button type="button" @click="toggleTheme" class="grid h-9 w-9 place-items-center rounded-lg text-ink transition hover:bg-panel2" :aria-label="themeLabel" :title="themeLabel">
        <svg class="icon h-[18px] w-[18px]" x-show="light"><use href="#i-sun"></use></svg><svg class="icon h-[18px] w-[18px]" x-show="dark"><use href="#i-moon"></use></svg></button>
      <button type="button" @click="toggleBookmark" x-show="showDupEditor" class="grid h-9 w-9 place-items-center rounded-lg transition hover:bg-panel2" :class="bookmarkCls" :aria-pressed="bookmarkPressed" :aria-label="bookmarkLabel" :title="bookmarkLabel">
        <svg class="icon h-[18px] w-[18px]" x-show="notBookmarked"><use href="#i-bookmark"></use></svg><svg class="icon h-[18px] w-[18px]" x-show="bookmarked"><use href="#i-bookmark-check"></use></svg></button>
      <div class="relative" @click.outside="closeSettings">
        <button type="button" @click="toggleSettings" class="grid h-9 w-9 place-items-center rounded-lg text-ink transition hover:bg-panel2" aria-haspopup="true" :aria-expanded="settingsExpanded" :aria-label="L.settings" :title="L.settings">
          <svg class="icon h-[18px] w-[18px]"><use href="#i-settings"></use></svg></button>
        <div x-show="settingsOpen" class="absolute right-0 top-full z-30 mt-2 w-72 space-y-3 rounded-xl border border-line bg-panel p-3 text-ink shadow-2xl" role="dialog" :aria-label="L.settings">
          <p class="text-[12px] text-mute" x-text="L.reindexHint"></p>
          <dl class="space-y-1 text-[12px]">
            <div class="flex justify-between gap-3"><dt class="text-mute" x-text="L.project"></dt><dd class="truncate font-medium" x-text="project"></dd></div>
            <div class="flex justify-between gap-3"><dt class="text-mute" x-text="L.snapshot"></dt><dd class="truncate font-medium" x-text="snapshotAt"></dd></div>
          </dl>
          <div class="flex items-center justify-between gap-3 border-t border-line pt-3">
            <span class="text-mute" x-text="L.uiLanguage"></span>
            <button type="button" @click="toggleLang" class="flex items-center gap-1.5 rounded-md border border-line px-2 py-1 hover:bg-panel2"><svg class="icon"><use href="#i-globe"></use></svg><span x-text="langName"></span></button>
          </div>
          <div class="space-y-3 border-t border-line pt-3" x-show="showDupEditor">
            <p class="text-[11px] font-semibold uppercase tracking-wide text-mute" x-text="L.editorOptions"></p>
            <div class="flex flex-wrap items-center gap-1.5">
              <span class="mr-1 text-mute" x-text="L.show"></span>
              <template x-for="f in codeFilters" :key="f.key">
                <button type="button" :data-v="f.key" @click="setCodeFilter" class="rounded-full border px-2.5 py-1 text-[11px] transition" :class="f.cls" x-text="f.label"></button>
              </template>
            </div>
            <template x-for="s in switches" :key="s.key">
              <button type="button" role="switch" :aria-checked="s.on" :data-v="s.key" @click="flipSwitch" class="flex w-full items-center justify-between gap-3 text-left">
                <span x-text="s.label"></span>
                <span class="relative h-5 w-9 shrink-0 rounded-full transition" :class="s.track"><span class="absolute top-0.5 h-4 w-4 rounded-full bg-white shadow transition-all" :class="s.knob"></span></span>
              </button>
            </template>
            <div class="flex items-center justify-between gap-3">
              <span x-text="L.fontSize"></span>
              <span class="flex items-center gap-1">
                <button type="button" @click="fontDown" class="rounded-md border border-line p-1.5 hover:bg-panel2" :aria-label="L.fontDown" :title="L.fontDown"><svg class="icon"><use href="#i-minus"></use></svg></button>
                <span class="w-10 text-center font-mono text-[12px]" x-text="fontLabel"></span>
                <button type="button" @click="fontUp" class="rounded-md border border-line p-1.5 hover:bg-panel2" :aria-label="L.fontUp" :title="L.fontUp"><svg class="icon"><use href="#i-plus"></use></svg></button>
              </span>
            </div>
            <div class="flex flex-wrap gap-2">
              <button type="button" @click="openAll" x-show="hasClosed" class="flex items-center gap-1 rounded-md border border-line px-2 py-1.5 hover:bg-panel2"><svg class="icon"><use href="#i-copy"></use></svg><span x-text="L.openAll"></span></button>
              <button type="button" @click="copyCode" class="flex items-center gap-1 rounded-md border border-line px-2 py-1.5 hover:bg-panel2"><svg class="icon"><use href="#i-clipboard-copy"></use></svg><span x-text="L.copyCode"></span></button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </header>

  <p class="border-b border-warn/40 bg-warn/10 px-4 py-2 text-warn" x-show="warning" x-text="warning"></p>

  <!-- Home: the dashboard index -->
  <section class="flex-1 space-y-6 overflow-y-auto p-6 scroll-thin" x-show="showHome">
    <div class="flex items-center gap-4">
      <span class="grid h-14 w-14 place-items-center rounded-2xl bg-brand text-onbrand"><svg class="icon h-7 w-7"><use href="#i-scan-search"></use></svg></span>
      <div><h1 class="text-3xl font-bold" x-text="L.helloTitle"></h1><p class="text-mute" x-text="L.helloSub"></p></div>
    </div>
    <div class="grid grid-cols-2 gap-3 md:grid-cols-4 xl:grid-cols-8">
      <template x-for="s in cards" :key="s.label"><div class="rounded-xl border border-line bg-panel p-3"><div class="text-2xl font-bold" x-text="s.value"></div><div class="text-[11px] uppercase tracking-wide text-mute" x-text="s.label"></div></div></template>
    </div>
    <div class="grid gap-3 md:grid-cols-3">
      <template x-for="n in homeLinks" :key="n.view">
        <button type="button" :data-v="n.view" @click="go" class="flex items-center gap-3 rounded-xl border border-line bg-panel p-4 text-left transition hover:border-brand hover:bg-panel2">
          <span class="grid h-10 w-10 place-items-center rounded-lg bg-brand/15 text-accent"><svg class="icon h-5 w-5"><use :href="n.icon"></use></svg></span>
          <span><span class="block font-semibold" x-text="n.label"></span><span class="block text-[11px] text-mute" x-text="n.hint"></span></span>
        </button>
      </template>
    </div>
  </section>

  <section class="flex-1 space-y-3 overflow-y-auto p-6" x-show="showOrphans">
    <h1 class="text-3xl font-bold" x-text="L.navOrphans"></h1>
    <p x-text="L.orphanHint"></p>
    <p x-show="noOrphans" x-text="L.noOrphans"></p>
    <template x-for="row in orphans" :key="row.key">
      <article class="rounded-xl border border-line bg-panel p-4">
        <p x-text="row.label"></p><p class="text-mute" x-text="row.when"></p><p x-text="row.reason"></p>
        <button type="button" :data-v="row.key" @click="inspectOrphan" class="rounded-md border border-line px-3 py-2" x-text="L.inspectOrphan"></button>
        <button type="button" :data-v="row.key" @click="deleteOrphan" class="rounded-md border border-line px-3 py-2" x-text="L.deleteDecision"></button>
      </article>
    </template>
    <nav class="page-controls flex items-center gap-3" :aria-label="L.navOrphans">
      <button type="button" @click="previousPage" :disabled="previousDisabled" class="rounded-md border border-line px-3 py-2" x-text="L.previousPage"></button>
      <span x-text="listCount"></span>
      <button type="button" @click="nextPage" :disabled="nextDisabled" class="rounded-md border border-line px-3 py-2" x-text="L.nextPage"></button>
    </nav>
    <article class="space-y-2 rounded-xl border border-line bg-panel p-4" x-show="hasOrphanInfo">
      <h2 class="font-semibold" x-text="L.orphanDetails"></h2>
      <template x-for="(info, n) in orphanInfoRows" :key="n"><p class="whitespace-pre-wrap" x-text="info"></p></template>
    </article>
  </section>

  <!-- Editor tab: toolbar for one dead-code candidate (duplicates have their own layout below) -->
  <div class="flex flex-wrap items-center gap-2 border-b border-line bg-panel px-4 py-2" x-show="showToolbar">
    <button type="button" @click="prevDup" class="rounded-md border border-line p-1.5 hover:bg-panel2" :aria-label="prevLabel" :title="prevLabel"><svg class="icon"><use href="#i-chevron-left"></use></svg></button>
    <button type="button" @click="nextDup" class="rounded-md border border-line p-1.5 hover:bg-panel2" :aria-label="nextLabel" :title="nextLabel"><svg class="icon"><use href="#i-chevron-right"></use></svg></button>
    <span class="mr-2 font-medium" x-text="editorFooter"></span>
    <span class="text-mute" x-text="L.show"></span>
    <template x-for="f in codeFilters" :key="f.key">
      <button type="button" :data-v="f.key" @click="setCodeFilter" class="rounded-full border px-2.5 py-1 text-[11px] transition" :class="f.cls" x-text="f.label"></button>
    </template>
    <input type="search" @input="searchCode" :placeholder="L.findInCode" :aria-label="L.findInCode" class="w-52 rounded-md border border-line bg-panel2 px-3 py-1.5 outline-none focus:border-brand">
    <button type="button" @click="closeAll" x-show="canCloseAll" class="flex items-center gap-1 rounded-md border border-line px-2 py-1.5 hover:bg-panel2"><svg class="icon"><use href="#i-x"></use></svg><span x-text="L.closeAll"></span></button>
    <button type="button" @click="openAll" x-show="hasClosed" class="flex items-center gap-1 rounded-md border border-line px-2 py-1.5 hover:bg-panel2"><svg class="icon"><use href="#i-copy"></use></svg><span x-text="L.openAll"></span></button>
    <div class="ml-auto flex items-center gap-1">
      <button type="button" @click="toggleFiles" class="rounded-md border p-1.5" :class="filesBtnCls" :aria-label="L.toggleFiles" :title="L.toggleFiles"><svg class="icon"><use href="#i-panel-left"></use></svg></button>
      <button type="button" @click="toggleAside" class="rounded-md border p-1.5" :class="asideBtnCls" :aria-label="L.toggleAside" :title="L.toggleAside"><svg class="icon"><use href="#i-panel-right"></use></svg></button>
      <button type="button" @click="toggleWrap" class="rounded-md border p-1.5" :class="wrapBtnCls" :aria-label="L.wrap" :title="L.wrap"><svg class="icon"><use href="#i-wrap-text"></use></svg></button>
      <button type="button" @click="fontDown" class="rounded-md border border-line p-1.5 hover:bg-panel2" :aria-label="L.fontDown" :title="L.fontDown"><svg class="icon"><use href="#i-minus"></use></svg></button>
      <button type="button" @click="fontUp" class="rounded-md border border-line p-1.5 hover:bg-panel2" :aria-label="L.fontUp" :title="L.fontUp"><svg class="icon"><use href="#i-plus"></use></svg></button>
      <button type="button" @click="copyCode" class="flex items-center gap-1 rounded-md border border-line px-2 py-1.5 hover:bg-panel2"><svg class="icon"><use href="#i-clipboard-copy"></use></svg><span x-text="L.copyCode"></span></button>
      <button type="button" @click="closeTab" class="flex items-center gap-1 rounded-md border border-line px-2 py-1.5 hover:bg-panel2"><svg class="icon"><use href="#i-x"></use></svg><span x-text="L.closeTab"></span></button>
    </div>
  </div>
  <p class="p-8 text-center text-mute" x-show="gone" x-text="notFoundText"></p>

  <!-- Duplicates and dead code share one layout: list | detail + review -->
  <!-- x-if, not x-show: each editor binds fields only its own view-model has -->
  <template x-if="showMain">
  <main class="grid flex-1 gap-3 p-3 lg:min-h-0" :class="mainCls">
    <aside class="flex min-h-[320px] flex-col rounded-xl border border-line bg-panel lg:min-h-0" x-show="listMode">
      <div class="space-y-2 border-b border-line p-3">
        <h1 class="flex items-center gap-2 text-base font-semibold"><span x-text="listTitle"></span><span class="text-[11px] font-normal text-mute" x-text="listCount"></span></h1>
        <div class="flex flex-wrap gap-1.5">
          <template x-for="f in filters" :key="f.key">
            <button type="button" :data-v="f.key" @click="setFilter" class="rounded-full border px-2.5 py-1 text-[11px] transition" :class="f.cls" x-text="f.label"></button>
          </template>
        </div>
      </div>
      <ul class="scroll-thin min-h-0 flex-1 space-y-1.5 overflow-y-auto p-2">
        <template x-for="row in rows" :key="row.identity">
          <li>
            <button type="button" :data-v="row.identity" @click="select" class="w-full rounded-lg border p-2.5 text-left transition hover:bg-panel2" :class="row.cls">
              <span class="flex items-center gap-2">
                <span class="rounded bg-brand/15 px-1.5 py-0.5 text-[10px] text-accent" x-text="row.badge"></span>
                <span class="rounded bg-panel2 px-1.5 py-0.5 text-[10px] text-mute" x-text="row.language"></span>
                <span class="ml-auto rounded px-1.5 py-0.5 text-[10px] font-medium" :class="row.chipCls" x-text="row.chip"></span>
              </span>
              <span class="mt-1 block truncate font-mono font-medium" x-text="row.title"></span>
              <span class="flex items-center gap-1"><span class="min-w-0 truncate font-mono text-[11px] text-info" x-text="row.sub"></span><svg class="icon ml-auto text-accent" x-show="row.marked" :aria-label="L.markedRow"><use href="#i-bookmark-check"></use></svg></span>
              <span class="block text-[11px] text-mute" x-text="row.meta"></span>
            </button>
          </li>
        </template>
        <li class="rounded-xl border border-dashed border-line p-6 text-center text-mute" x-show="noRows" x-text="empty"></li>
      </ul>
      <nav class="page-controls flex items-center justify-between gap-2 border-t border-line p-3" :aria-label="listTitle">
        <button type="button" @click="previousPage" :disabled="previousDisabled" class="rounded-md border border-line px-2 py-1" x-text="L.previousPage"></button>
        <button type="button" @click="nextPage" :disabled="nextDisabled" class="rounded-md border border-line px-2 py-1" x-text="L.nextPage"></button>
      </nav>
    </aside>

    <section class="flex flex-col gap-3 lg:min-h-0 lg:overflow-y-auto scroll-thin">
      <p class="rounded-xl border border-dashed border-line p-8 text-center text-mute" x-show="noSel" x-text="pickText"></p>

      <form class="space-y-2 rounded-xl border border-line bg-panel p-3" x-show="showReview" @submit.prevent="saveReview">
        <h2 class="font-semibold" x-text="L.findingReview"></h2>
        <p class="text-mute" x-text="L.findingHint"></p>
        <p class="text-info" x-text="reviewStateText"></p>
        <fieldset class="flex flex-wrap gap-2">
          <legend class="text-mute" x-text="L.findingReview"></legend>
          <template x-for="choice in reviewChoices" :key="choice.key">
            <button type="button" :data-v="choice.key" @click="setReviewAction" :aria-pressed="choice.on" class="rounded-md border px-3 py-2" :class="choice.cls" x-text="choice.label"></button>
          </template>
        </fieldset>
        <label class="block text-mute"><span x-text="L.findingReason"></span>
          <textarea x-model="reviewReason" @input="markReviewDirty" rows="2" maxlength="500" class="mt-1 w-full rounded-md border border-line bg-panel2 p-2 text-ink outline-none focus:border-brand"></textarea>
        </label>
        <p class="text-warn" x-show="reviewDirty" x-text="L.retainedDraft"></p>
        <p class="text-warn" x-show="hasConflict" x-text="L.conflict"></p>
        <div class="flex flex-wrap gap-2">
          <button type="submit" :disabled="reviewSaveDisabled" class="rounded-md bg-brand px-3 py-1.5 font-medium text-onbrand" x-text="L.reviewSave"></button>
          <button type="button" @click="discardReviewDraft" x-show="reviewDirty" class="rounded-md border border-line px-3 py-2" x-text="L.discardDraft"></button>
          <button type="button" @click="reviewLatest" x-show="hasConflict" class="rounded-md border border-line px-3 py-2" x-text="L.reviewLatest"></button>
        </div>
      </form>

      <div class="space-y-3" x-show="showEditor">
        <div class="grid gap-3" :class="editorCols">
          <div class="rounded-xl border border-line bg-panel p-3 xl:self-start" x-show="showFiles">
            <h2 class="mb-2 font-semibold" x-show="isDead" x-text="L.symbol"></h2>
            <dl class="space-y-1.5" x-show="isDead">
              <template x-for="f in deadInfo.facts" :key="f.key">
                <div class="rounded-lg border border-line px-2 py-1.5">
                  <dt class="text-[10px] uppercase tracking-wide text-mute" x-text="f.label"></dt>
                  <dd class="break-all font-mono text-[12px] font-medium" x-text="f.value"></dd>
                </div>
              </template>
            </dl>
          </div>

          <div class="min-w-0 space-y-3">
            <div class="scroll-thin flex items-end overflow-x-auto border-b border-line" role="tablist">
              <button type="button" @click="openAll" x-show="hasClosed" class="order-last mb-1 ml-2 shrink-0 rounded-md border border-line px-2 py-1 text-[11px] hover:bg-panel2" x-text="L.openAll"></button>
              <template x-for="tb in tabs" :key="tb.idx">
                <div class="group flex min-w-[8rem] max-w-[16rem] flex-1 items-center rounded-t-md border-x border-b-0 border-t" :class="tb.tabCls">
                  <button type="button" role="tab" :data-v="tb.idx" @click="pickFile" class="flex min-w-0 flex-1 items-center gap-1.5 px-2 py-1.5 text-left" :title="tb.path">
                    <b class="rounded px-1.5 text-[10px]" :class="tb.tagCls" x-text="tb.tag"></b>
                    <span class="min-w-0 truncate font-mono text-[12px]"><span x-text="tb.base"></span> <span class="text-[10px] opacity-70" x-text="tb.dir"></span></span>
                  </button>
                  <button type="button" :data-v="tb.idx" @click="closeFile" x-show="tb.closable" class="mr-1 rounded p-1 hover:bg-bad/20 hover:text-bad" :aria-label="L.closeFile" :title="L.closeFile"><svg class="icon"><use href="#i-x"></use></svg></button>
                </div>
              </template>
            </div>
            <p class="rounded-xl border border-dashed border-line p-8 text-center text-mute" x-show="noneOpen" x-text="L.noneOpen"></p>
            <nav class="page-controls flex flex-wrap items-center gap-2" :aria-label="L.show">
              <button type="button" @click="previousSource" :disabled="sourcePreviousDisabled" class="rounded-md border border-line px-3 py-2" x-text="L.sourcePrevious"></button>
              <button type="button" @click="nextSource" :disabled="sourceNextDisabled" class="rounded-md border border-line px-3 py-2" x-text="L.sourceNext"></button>
              <span class="text-warn" x-show="sourcePartial" x-text="L.sourcePartial"></span>
              <span class="text-bad" x-show="sourceUnavailable" x-text="L.sourceUnavailable"></span>
            </nav>
            <div class="scroll-thin flex gap-3 overflow-x-auto pb-1">
              <template x-for="p in panes" :key="p.idx">
                <article class="min-w-[28rem] flex-1 overflow-hidden rounded-xl border bg-panel" :class="p.cls">
                  <header class="flex items-start gap-2 border-b border-line px-3 py-2">
                    <div class="min-w-0 flex-1">
                      <p class="flex items-center gap-1.5 truncate font-medium"><b class="rounded px-1.5 text-[10px]" :class="p.tagCls" x-text="p.tag"></b> <span class="truncate font-mono" :title="p.path" x-text="p.path"></span></p>
                      <p class="text-[11px] text-mute" x-text="p.lines"></p>
                    </div>
                    <span class="rounded px-1.5 py-0.5 text-[11px] font-medium" :class="p.simCls" :title="p.simTitle" x-text="p.similarity"></span>
                    <button type="button" :data-v="p.idx" @click="soloFile" x-show="p.multi" class="rounded p-1 text-mute hover:bg-panel2 hover:text-ink" :aria-label="L.soloFile" :title="L.soloFile"><svg class="icon"><use href="#i-maximize-2"></use></svg></button>
                  </header>

            <li><button type="button" :data-v="n.name" @click="openNote" class="w-full rounded-lg border p-2.5 text-left hover:bg-panel2" :class="n.cls">
              <span class="flex items-center gap-2"><span class="rounded bg-brand/15 px-1.5 py-0.5 text-[10px] text-accent" x-text="n.kind"></span><span class="ml-auto text-[11px] text-mute" x-text="n.links"></span></span>
              <span class="mt-1 block truncate font-medium" x-text="n.title"></span><span class="block truncate font-mono text-[11px] text-info" x-text="n.name"></span></button></li>
          </template>
        </ul>
      </div>
    </div>
    <article class="rounded-xl border border-line bg-panel p-4" x-show="hasNote">
      <div class="flex flex-wrap items-center gap-2"><h2 class="text-base font-semibold" x-text="note.title"></h2><span class="font-mono text-[11px] text-info" x-text="note.name"></span>
        <button type="button" @click="focusCurrent" class="ml-auto flex items-center gap-1 rounded-md border border-line px-2 py-1 hover:bg-panel2"><svg class="icon"><use href="#i-network"></use></svg><span x-text="L.seeInGraph"></span></button>
        <button type="button" @click="closeNote" class="rounded-md border border-line p-1 hover:bg-panel2" :aria-label="L.close"><svg class="icon"><use href="#i-x"></use></svg></button></div>
      <div class="mt-3 grid gap-4 lg:grid-cols-[minmax(0,1fr)_280px]">
        <pre class="scroll-thin max-h-[420px] overflow-auto whitespace-pre-wrap rounded-lg bg-bg/60 p-3 font-mono text-[12px] leading-5" x-text="note.text"></pre>
        <div class="space-y-3">
          <div><h3 class="mb-1 font-semibold" x-text="L.linksTo"></h3>
            <ul class="space-y-1"><template x-for="l in note.links" :key="l.name"><li><button type="button" :data-v="l.name" @click="openNote" class="text-left text-info hover:underline" x-text="l.title"></button></li></template></ul></div>
          <div><h3 class="mb-1 font-semibold" x-text="L.linkedFrom"></h3>
            <ul class="space-y-1"><template x-for="l in note.backlinks" :key="l.name"><li><button type="button" :data-v="l.name" @click="openNote" class="text-left text-info hover:underline" x-text="l.title"></button></li></template></ul></div>
        </div>
      </div>
    </article>
  </section>
</div>

<div x-show="toast" class="fixed bottom-4 left-1/2 -translate-x-1/2 rounded-lg bg-ink px-4 py-2 text-bg shadow-xl" role="status" x-text="toast"></div>
</body>
</html>
