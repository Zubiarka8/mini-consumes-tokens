[package]
name = "mct-cli"
description = "CLI for mini-consumes-tokens: init/reindex/status subcommands over the local tree-sitter-backed symbol index."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["mcp", "cli", "code-index", "tree-sitter"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
anyhow = "1.0.104"
mct-core.workspace = true
mct-index.workspace = true
mct-languages.workspace = true
mct-mcp-server = { path = "../mct-mcp-server" }
mct-obsidian.workspace = true
tokio = { version = "1.53.1", features = ["rt", "time"] }
clap = { version = "4.6.6", features = ["derive"] }
git2 = { version = "0.21.0", default-features = false }
serde_json = "1.0.151"
getrandom = "0.3.4"
form_urlencoded = "1.2.2"
tempfile = "3.27.0"

[dev-dependencies]
# examples/token_benchmark.rs indexes each fixture with a one-language
# registry; production code uses mct-languages' shared registry instead.
mct-lang-bash.workspace = true
mct-lang-cpp.workspace = true
mct-lang-csharp.workspace = true
mct-lang-css.workspace = true
mct-lang-go.workspace = true
mct-lang-html.workspace = true
mct-lang-java.workspace = true
mct-lang-js-ts.workspace = true
mct-lang-php.workspace = true
mct-lang-powershell.workspace = true
mct-lang-python.workspace = true
mct-lang-rust.workspace = true
mct-lang-xaml.workspace = true
mct-lang-xml.workspace = true
walkdir = "2.5.0"
