# Standalone workspace (empty [workspace] table below): keeps this fuzzing
# harness out of the parent workspace's `members`/lockfile — it's a throwaway
# tool, not a deliverable crate.
[workspace]

[package]
name = "mct-index-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"

[dependencies.mct-index]
path = ".."

[[bin]]
name = "glb-json-chunk"
path = "fuzz_targets/glb_json_chunk.rs"
test = false
doc = false
bench = false
