[package]
name = "ccm-cli"
description = "CLI for mini-consumes-tokens: init/reindex/status subcommands over the local tree-sitter-backed symbol index."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["mcp", "cli", "code-index", "tree-sitter"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
anyhow = "1.0.104"
ccm-core.workspace = true
ccm-index.workspace = true
ccm-lang-bash.workspace = true
ccm-lang-cpp.workspace = true
ccm-lang-csharp.workspace = true
ccm-lang-css.workspace = true
ccm-lang-go.workspace = true
ccm-lang-html.workspace = true
ccm-lang-java.workspace = true
ccm-lang-js-ts.workspace = true
ccm-lang-kotlin.workspace = true
ccm-lang-md.workspace = true
ccm-lang-php.workspace = true
ccm-lang-powershell.workspace = true
ccm-lang-python.workspace = true
ccm-lang-rust.workspace = true
ccm-lang-xaml.workspace = true
ccm-lang-xml.workspace = true
clap = { version = "4.6.6", features = ["derive"] }
serde_json = "1.0.151"
walkdir = "2.5.0"
