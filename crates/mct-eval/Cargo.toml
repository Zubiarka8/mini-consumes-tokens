[package]
name = "mct-eval"
description = "Continuous quality evaluation for mini-consumes-tokens's MCP tools: accuracy, success rate, latency and token cost of a fixed query suite, compared against a checked-in baseline."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive"] }
mct-index.workspace = true
mct-mcp-server = { path = "../mct-mcp-server" }
rmcp = { version = "3.4.1", features = ["server"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros"] }
