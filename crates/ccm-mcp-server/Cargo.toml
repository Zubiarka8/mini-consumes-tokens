[package]
name = "ccm-mcp-server"
description = "MCP server exposing mini-consumes-tokens's tree-sitter-backed symbol index as Claude Code tools: list_symbols, find_symbol, find_references, find_calls, find_callers, impact_analysis, reindex, get_indexing_status, get_file_skeleton."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["mcp", "claude-code", "code-index", "tree-sitter"]
categories = ["development-tools", "command-line-utilities"]

[dependencies]
anyhow = "1.0.104"
ccm-core.workspace = true
ccm-index.workspace = true
ccm-lang-bash.workspace = true
ccm-lang-cpp.workspace = true
ccm-lang-csharp.workspace = true
ccm-lang-css.workspace = true
ccm-lang-go.workspace = true
ccm-lang-html.workspace = true
ccm-lang-java.workspace = true
ccm-lang-js-ts.workspace = true
ccm-lang-kotlin.workspace = true
ccm-lang-md.workspace = true
ccm-lang-php.workspace = true
ccm-lang-powershell.workspace = true
ccm-lang-python.workspace = true
ccm-lang-rust.workspace = true
ccm-lang-xaml.workspace = true
ccm-lang-xml.workspace = true
clap = { version = "4.6.6", features = ["derive"] }
rmcp = { version = "3.3.0", features = ["server", "macros", "transport-io"] }
schemars = "1.2.2"
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "sync"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
