[package]
name = "mct-lang-lua"
description = "Lua language plugin (tree-sitter-lua) for mini-consumes-tokens's LanguageParser trait. Built as an architecture-validation exercise (Lua is outside the project's original 7-language scope) and not wired into the production mct-cli/mct-mcp-server registries, but a working standalone plugin."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["mcp", "tree-sitter", "lua", "code-index"]
categories = ["development-tools", "parser-implementations"]

[dependencies]
mct-core.workspace = true
tree-sitter.workspace = true
tree-sitter-lua = "0.5.0"

[dev-dependencies]
mct-index.workspace = true
walkdir = "2.5.0"
