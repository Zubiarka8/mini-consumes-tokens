# Standalone workspace (empty [workspace] table below): keeps this fuzzing
# harness out of the parent workspace's `members`/lockfile — it's a throwaway
# tool, not a deliverable crate.
[workspace]

[package]
name = "mct-lang-java-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"

[dependencies.mct-core]
path = "../../mct-core"

[dependencies.mct-lang-java]
path = ".."

[[bin]]
name = "parse-java"
path = "fuzz_targets/parse_java.rs"
test = false
doc = false
bench = false
